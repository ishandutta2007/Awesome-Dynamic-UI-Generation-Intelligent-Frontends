<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1deg); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-1.5deg); }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    @keyframes beacon {
      0%, 100% { r: 4px; opacity: 1; }
      50% { r: 7px; opacity: 0.4; }
    }

    .bg-orb-1 { animation: pulseGlow 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .bg-orb-2 { animation: pulseGlow 10s ease-in-out infinite alternate; transform-origin: 1000px 320px; }
    .card-anim-1 { animation: floatCard1 6s ease-in-out infinite; }
    .card-anim-2 { animation: floatCard2 7s ease-in-out infinite; }
    .pill-anim-1 { animation: floatPill 5s ease-in-out infinite; }
    .pill-anim-2 { animation: floatPill 6s ease-in-out infinite 1s; }
    .pill-anim-3 { animation: floatPill 5.5s ease-in-out infinite 0.5s; }
    .stream-line { stroke-dasharray: 6 6; animation: dashMove 2.5s linear infinite; }
    .beacon-dot { animation: beacon 2s ease-in-out infinite; }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      font-weight: 600;
    }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Technical Grid pattern (subtle background) -->
  <g opacity="0.12">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200 M0 360 H1200" stroke="#94a3b8" stroke-width="1" />
    <path d="M120 0 V420 M240 0 V420 M360 0 V420 M480 0 V420 M600 0 V420 M720 0 V420 M840 0 V420 M960 0 V420 M1080 0 V420" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Glowing Background Orbs (Behind content) -->
  <circle class="bg-orb-1" cx="220" cy="120" r="160" fill="#6366f1" filter="url(#glow)" />
  <circle class="bg-orb-2" cx="980" cy="300" r="180" fill="#ec4899" filter="url(#glow)" />
  <circle cx="600" cy="210" r="120" fill="#06b6d4" opacity="0.18" filter="url(#glow)" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS (Positioned safely around edges) -->
  
  <!-- Left Side: Dynamic Flow Card (Prompt -> AST -> UI) -->
  <g class="card-anim-1" transform="translate(60, 240)">
    <rect width="250" height="130" rx="12" fill="url(#card-grad)" stroke="#334155" stroke-width="1.5" />
    <!-- Window controls -->
    <circle cx="24" cy="22" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="40" cy="22" r="5" fill="#eab308" opacity="0.8" />
    <circle cx="56" cy="22" r="5" fill="#22c55e" opacity="0.8" />
    <text x="80" y="26" class="badge-text" fill="#64748b">Generative UI Stream</text>
    
    <!-- Code tokens / UI preview bars -->
    <rect x="20" y="45" width="130" height="10" rx="5" fill="#6366f1" opacity="0.7" />
    <rect x="20" y="65" width="210" height="8" rx="4" fill="#334155" />
    <rect x="20" y="82" width="170" height="8" rx="4" fill="#334155" />
    <rect x="20" y="99" width="90" height="16" rx="6" fill="#06b6d4" opacity="0.85" />
    
    <!-- Active streaming beacon -->
    <circle class="beacon-dot" cx="225" cy="107" r="5" fill="#22c55e" />
  </g>

  <!-- Right Side: Dynamic Agent State & Component Card -->
  <g class="card-anim-2" transform="translate(890, 60)">
    <rect width="250" height="150" rx="12" fill="url(#card-grad)" stroke="#475569" stroke-width="1.5" />
    <circle cx="24" cy="22" r="5" fill="#ec4899" opacity="0.7" />
    <text x="40" y="26" class="badge-text" fill="#a855f7">&lt;AdaptiveComponent /&gt;</text>
    
    <!-- Dynamic Component Mockup -->
    <rect x="20" y="46" width="210" height="42" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="42" cy="67" r="12" fill="#3b82f6" opacity="0.3" />
    <rect x="65" y="58" width="90" height="8" rx="4" fill="#f8fafc" opacity="0.8" />
    <rect x="65" y="72" width="60" height="6" rx="3" fill="#64748b" />
    <rect x="175" y="58" width="45" height="18" rx="5" fill="#8b5cf6" opacity="0.9" />

    <rect x="20" y="102" width="95" height="28" rx="6" fill="#0ea5e9" opacity="0.25" stroke="#0ea5e9" stroke-width="1" />
    <text x="32" y="120" class="badge-text" fill="#38bdf8">JSON-RPC</text>

    <rect x="125" y="102" width="105" height="28" rx="6" fill="#ec4899" opacity="0.2" stroke="#ec4899" stroke-width="1" />
    <text x="138" y="120" class="badge-text" fill="#f472b6">AG-UI Sync</text>
  </g>

  <!-- Animated Stream Lines connecting modules in the background -->
  <path class="stream-line" d="M 310 300 Q 450 340 600 320 T 890 280" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.4" />
  <path class="stream-line" d="M 900 135 Q 750 90 600 110 T 310 160" fill="none" stroke="#ec4899" stroke-width="2" opacity="0.3" />

  <!-- Floating Feature Pills -->
  <g class="pill-anim-1" transform="translate(100, 75)">
    <rect width="180" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <text x="90" y="22" text-anchor="middle" class="badge-text" fill="#c7d2fe">⚡ Generative UI</text>
  </g>

  <g class="pill-anim-2" transform="translate(930, 260)">
    <rect width="190" height="34" rx="17" fill="#311042" stroke="#d946ef" stroke-width="1.2" />
    <text x="95" y="22" text-anchor="middle" class="badge-text" fill="#f5d0fe">🎨 Design-to-Code</text>
  </g>

  <g class="pill-anim-3" transform="translate(500, 345)">
    <rect width="200" height="34" rx="17" fill="#082f49" stroke="#0284c7" stroke-width="1.2" />
    <text x="100" y="22" text-anchor="middle" class="badge-text" fill="#bae6fd">🤖 Server-Driven Agents</text>
  </g>

  <!-- FOREGROUND: TITLE & SUBTITLE (Guaranteed high visibility and contrast) -->
  <g transform="translate(600, 155)">
    <!-- Main Header Gradient Backdrop Pill -->
    <rect x="-310" y="-42" width="620" height="48" rx="24" fill="#030712" opacity="0.7" stroke="#334155" stroke-width="1" />
    
    <text x="0" y="-8" text-anchor="middle" class="title-text">
      Awesome Dynamic UI Generation
    </text>
    <text x="0" y="32" text-anchor="middle" class="title-text" fill="url(#primary-glow)">
      &amp; Intelligent Frontends
    </text>
    
    <!-- Subtitle text with high-contrast soft dropshadow -->
    <text x="0" y="78" text-anchor="middle" class="subtitle-text">
      Curated Ecosystem of Generative UI Engines, AI Frontends &amp; Design-to-Code Platforms
    </text>
  </g>
</svg>